steps:
  # Use Google Buildpacks to build the image without a Dockerfile
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - 'build'
      - 'gcr.io/$PROJECT_ID/emerald-mvc'
      - '--builder'
      - 'gcr.io/buildpacks/builder:v1'
      - '--path'
      - '.'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'emerald-mvc'
      - '--image'
      - 'gcr.io/$PROJECT_ID/emerald-mvc'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'nodejs-app-sa@emerald-497222.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
