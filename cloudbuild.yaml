steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/emerald-mvc:$COMMIT_SHA', '.']

  # 2. Push the image to the registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/emerald-mvc:$COMMIT_SHA']

  # 3. Deploy the new image to your existing Cloud Run service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'emerald-mvc'
      - '--image'
      - 'gcr.io/$PROJECT_ID/emerald-mvc:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'nodejs-app-sa@emerald-497222.iam.gserviceaccount.com'